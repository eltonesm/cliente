name: CI Workflow Java

# Quando o workflow será executado
on:
  push:
    branches:
      - dev    # Executa ao fazer push na branch "main"
  pull_request:
    branches:
      - dev    # Executa ao abrir pull requests para a branch "main"

# Define os jobs (tarefas) do workflow
jobs:
  build:
    # O job será executado em um sistema operacional Ubuntu
    runs-on: ubuntu-latest

    # Passos a serem executados no job
    steps:
      # Etapa 1: Fazer checkout do código do repositório
      - name: Checkout do código
        uses: actions/checkout@v3

      # Etapa 2: Configurar o Java (JDK 17)
      - name: Configurar o JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin' # Especifica a distribuição do JDK (obrigatório)

      # Etapa 3: Construir o projeto usando Maven
      - name: Build do projeto com Maven
        run: mvn clean install

      # Etapa 4: Executar os testes automatizados
      - name: Executar testes com log detalhado
        run: mvn test -X

      # Etapa 5: Upload de relatórios de teste
      - name: Upload de relatórios de teste
        uses: actions/upload-artifact@v3
        with:
          name: surefire-reports
          path: target/surefire-reports

